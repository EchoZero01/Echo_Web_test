<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://p1.music.126.net">
<link rel="dns-prefetch" href="https://p1.music.126.net">
<link rel="dns-prefetch" href="https://p2.music.126.net">
<link rel="dns-prefetch" href="https://p3.music.126.net">
<link rel="dns-prefetch" href="https://p4.music.126.net">
<title>澪音 · EchoZero 的想法集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232E5A4C'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23F5F2E9' font-family='serif'%3E%E6%BE%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 设计变量：纸墨主题 ============ */
:root{
  --paper:#F4F1E8;
  --paper-deep:#EBE6D8;
  --card:#FBF9F2;
  --ink:#21252B;
  --ink-2:#50575F;
  --ink-3:#8B9097;
  --line:#DCD5C2;
  --line-strong:#C8C0A9;
  --accent:#2E5A4C;
  --accent-deep:#1F4035;
  --accent-wash:#DEE9E2;
  --accent-ink:#17332A;
  --danger:#9C3D2E;
  --danger-wash:#F0DDD7;
  --shadow:0 1px 0 rgba(33,37,43,.04), 0 10px 28px -18px rgba(33,37,43,.28);
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
[data-theme="dark"]{
  --paper:#141619;
  --paper-deep:#1A1D21;
  --card:#1D2025;
  --ink:#E8E5DB;
  --ink-2:#A7ADB4;
  --ink-3:#6C727A;
  --line:#2C3037;
  --line-strong:#3A3F47;
  --accent:#83B8A3;
  --accent-deep:#A9D1C0;
  --accent-wash:#21342D;
  --accent-ink:#C6E2D4;
  --danger:#D6806E;
  --danger-wash:#3A241F;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 32px -20px rgba(0,0,0,.7);
}

/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
  transition:background .3s ease,color .3s ease;
}
::selection{background:var(--accent);color:var(--paper)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(33,37,43,.035) 1px,transparent 1px);
  background-size:22px 22px;
}
[data-theme="dark"] body::before{opacity:.25}

.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 28px}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1060px;margin:0 auto;padding:0 28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.seal{
  width:36px;height:36px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:var(--paper);
  font-family:var(--serif);font-weight:700;font-size:17px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.brand-name{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.12em}
.brand-sub{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.22em;margin-top:1px}
.tools{display:flex;align-items:center;gap:6px}
.icon-btn{
  display:inline-flex;align-items:center;gap:7px;
  height:36px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:13px;
  transition:border-color .2s,color .2s,background .2s;
}
.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;flex:none}
.icon-btn.text-only .label{display:inline}
@media(max-width:640px){.icon-btn.text-only .label{display:none}.icon-btn{padding:0 10px}}

/* ============ Hero ============ */
.hero{padding-block:72px 40px;border-bottom:1px solid var(--line)}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;letter-spacing:.2em;color:var(--accent);
  font-weight:500;margin-bottom:22px;
}
.hero-kicker::before{content:"";width:26px;height:1px;background:var(--accent)}
.hero h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(34px,5.4vw,56px);line-height:1.25;letter-spacing:.01em;
}
.hero h1 .dot{color:var(--accent)}
.hero-desc{margin-top:18px;max-width:580px;color:var(--ink-2);font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;gap:14px 34px;margin-top:34px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.06em}

/* ============ 书写区 ============ */
.composer{
  margin:40px 0 26px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;
}
.composer-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px dashed var(--line);
  color:var(--ink-2);font-size:13px;letter-spacing:.05em;
}
.composer-head svg{width:16px;height:16px;color:var(--accent)}
.composer input[type=text],.composer textarea,.modal-pane input[type=text],.modal-pane textarea{
  width:100%;background:transparent;border:none;outline:none;resize:none;
  color:var(--ink);
}
.composer .c-title{font-family:var(--serif);font-weight:700;font-size:19px;padding:16px 20px 4px}
.composer .c-body{display:block;min-height:96px;padding:8px 20px 12px;line-height:1.85;font-size:15px}
.composer input.c-link{
  display:none;width:calc(100% - 40px);margin:4px 20px 2px;
  padding:10px 14px;border:1px solid var(--line);border-radius:9px;
  background:var(--paper);font-size:13.5px;
}
.composer input.c-link.show{display:block}
.composer input.c-link:focus{border-color:var(--accent)}
.composer input.c-tags{
  display:block;width:calc(100% - 40px);
  margin:10px 20px;padding:10px 14px;
  border:1px solid var(--line);border-radius:9px;
  background:var(--paper);font-size:13.5px;
}
.composer input.c-tags:focus{border-color:var(--accent)}
.composer-foot{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px 20px;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 80%,var(--paper));
}

/* 附件按钮栏 */
.attach-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.attach-btn{
  display:inline-flex;align-items:center;gap:6px;
  height:34px;padding:0 13px;border-radius:8px;
  border:1px solid var(--line);color:var(--ink-2);font-size:13px;
  transition:border-color .18s,color .18s;
}
.attach-btn:hover{border-color:var(--accent);color:var(--accent)}
.attach-btn svg{width:15px;height:15px}
.quota-text{font-size:11.5px;color:var(--ink-3);margin-left:6px}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  height:40px;padding:0 22px;border-radius:9px;
  background:var(--accent);color:var(--paper);font-weight:500;font-size:14.5px;
  transition:background .2s,transform .1s;
}
.btn-primary:hover{background:var(--accent-deep)}
[data-theme="dark"] .btn-primary{color:#12211B}
[data-theme="dark"] .btn-primary:hover{color:#0E1A15}
.btn-primary:active{transform:translateY(1px)}
.btn-primary svg{width:16px;height:16px}
.btn-ghost{
  height:40px;padding:0 18px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink-2);font-size:14px;transition:border-color .2s,color .2s;
}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--ink)}

/* 待提交媒体预览 */
.pending{display:none;margin:8px 20px 2px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pending.show{display:grid}
.pending-item{position:relative;height:80px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.pending-item img{width:100%;height:100%;object-fit:cover;display:block}
.pending-item .file-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10px;padding:4px;text-align:center}
.pending-item .file-fallback svg{width:20px;height:20px}
.pending-item .remove{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(20,22,25,.65);color:#fff;display:grid;place-items:center;font-size:13px;line-height:1;
}
.pending-link{
  grid-column:1/-1;display:flex;align-items:center;gap:8px;min-height:32px;
  border:1px solid var(--line);border-radius:8px;padding:4px 10px;
  font-size:12px;color:var(--ink-2);background:var(--paper);
}
.pending-link svg{width:14px;height:14px;color:var(--accent);flex:none}
.pending-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pending-link .remove{position:static;background:none;color:var(--danger);width:auto;height:auto;font-size:16px}

/* 待提交 B站视频预览 */
.pending-bili{
  grid-column:1/-1;position:relative;
  border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--paper);
}
.pending-bili .pb-cover{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper-deep)}
.pending-bili .pb-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pending-bili .pb-badge{
  position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;
  background:rgba(20,22,25,.72);color:#fff;font-size:10.5px;padding:2px 8px;border-radius:5px;letter-spacing:.04em;
}
.pending-bili .pb-badge svg{width:12px;height:12px;color:#FB7299}
.pending-bili .pb-meta{padding:9px 12px 11px}
.pending-bili .pb-title{
  font-size:13.5px;font-weight:500;line-height:1.5;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pending-bili .pb-owner{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.pending-bili .pb-loading{display:flex;align-items:center;gap:10px;padding:18px 14px;font-size:12.5px;color:var(--ink-2)}
.pending-bili .pb-loading .spin{width:15px;height:15px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:pbspin .7s linear infinite;flex:none}
@keyframes pbspin{to{transform:rotate(360deg)}}
.pending-bili > .remove{
  position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;z-index:2;
  background:rgba(20,22,25,.65);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1;
}

/* ============ 筛选工具条 ============ */
.toolbar{display:flex;flex-direction:column;gap:14px;margin:30px 0 24px}
.search-box{
  display:flex;align-items:center;gap:10px;
  height:44px;padding:0 16px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);
}
.search-box svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-size:14.5px}
.search-box .clear-search{display:none;color:var(--ink-3);font-size:13px;padding:4px}
.search-box.has-text .clear-search{display:inline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  height:32px;padding:0 15px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:13px;transition:all .18s;white-space:nowrap;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
[data-theme="dark"] .chip.active{color:#12211B}
.chip .n{opacity:.6;font-size:11px;margin-left:4px}

/* ============ 想法流 ============ */
.stream{column-count:2;column-gap:20px;margin-bottom:40px}
@media(max-width:680px){.stream{column-count:1}}
.card{
  break-inside:avoid;margin-bottom:20px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 20px 14px;position:relative;
  transition:border-color .2s,box-shadow:.25s;
}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card::before{
  content:"";position:absolute;top:-1px;left:18px;right:18px;height:2px;
  background:var(--accent);border-radius:2px;opacity:0;transition:opacity .2s;
}
.card:hover::before{opacity:.85}
.card-title{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.5;margin-bottom:8px;word-break:break-word}
.card-body{font-family:var(--serif);font-size:14.5px;line-height:1.9;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{
  font-family:var(--sans);font-size:11.5px;color:var(--accent);
  background:var(--accent-wash);border-radius:5px;padding:2px 8px;letter-spacing:.03em;
}
[data-theme="dark"] .tag{color:var(--accent-ink)}

/* 卡片图片网格 */
.card-media{margin-top:14px;display:grid;gap:6px}
.card-media img{width:100%;height:100%;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block;background:var(--paper-deep)}
.card-media.count-1{grid-template-columns:1fr}
.card-media.count-1 img{max-height:420px}
.card-media.count-2{grid-template-columns:1fr 1fr}
.card-media.count-2 img{height:150px}
.card-media.count-3{grid-template-columns:repeat(3,1fr)}
.card-media.count-3 img{height:108px}
.card-media.count-4{grid-template-columns:repeat(2,1fr)}
.card-media.count-4 img{height:128px}
.card-media.count-many{grid-template-columns:repeat(3,1fr)}
.card-media.count-many img{height:94px}
.card-media .more-mask{position:relative;height:94px;border-radius:8px;overflow:hidden;cursor:zoom-in}
.card-media .more-mask img{height:94px}
.card-media .more-mask .shade{
  position:absolute;inset:0;background:rgba(15,17,20,.55);color:#fff;
  display:grid;place-items:center;font-size:17px;font-weight:500;border-radius:8px;
}
/* 卡片视频 */
.card-video{margin-top:14px}
.card-video video{width:100%;border-radius:9px;max-height:440px;background:#000;display:block}
.video-name{font-size:11.5px;color:var(--ink-3);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 卡片链接 */
.link-card{
  display:flex;align-items:center;gap:11px;margin-top:14px;
  padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper);text-decoration:none;color:var(--ink);
  transition:border-color .18s;
}
.link-card:hover{border-color:var(--accent)}
.link-card .link-ico{
  width:32px;height:32px;border-radius:8px;background:var(--accent-wash);
  display:grid;place-items:center;flex:none;
}
.link-card .link-ico svg{width:16px;height:16px;color:var(--accent)}
.link-card .link-meta{min-width:0;flex:1}
.link-card .link-title{font-size:13px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .link-url{font-size:11.5px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-card .link-go{width:15px;height:15px;color:var(--ink-3);flex:none}

/* B站视频卡片 */
.bili-card{
  display:block;margin-top:14px;
  border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--paper);text-decoration:none;color:var(--ink);
  transition:border-color .18s,box-shadow .22s;
}
.bili-card:hover{border-color:var(--accent);box-shadow:0 10px 24px -17px rgba(33,37,43,.45)}
.bili-card .bc-cover{position:relative;aspect-ratio:16/9;background:var(--paper-deep);overflow:hidden}
.bili-card .bc-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.bili-card:hover .bc-cover img{transform:scale(1.035)}
.bili-card .bc-play{
  position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(0deg,rgba(15,17,20,.30),transparent 46%);
  opacity:0;transition:opacity .2s;
}
.bili-card:hover .bc-play{opacity:1}
.bili-card .bc-play span{
  width:48px;height:48px;border-radius:50%;
  background:rgba(20,22,25,.6);display:grid;place-items:center;backdrop-filter:blur(2px);
}
.bili-card .bc-play svg{width:21px;height:21px;color:#fff;margin-left:2px}
.bili-card .bc-badge{
  position:absolute;left:10px;bottom:9px;display:inline-flex;align-items:center;gap:4px;
  background:rgba(20,22,25,.72);color:#fff;font-size:10.5px;padding:3px 8px;border-radius:5px;letter-spacing:.04em;
}
.bili-card .bc-badge svg{width:12px;height:12px;color:#FB7299}
.bili-card .bc-meta{padding:10px 13px 12px}
.bili-card .bc-title{
  font-size:14px;font-weight:500;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.bili-card .bc-owner{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:5px}
.bili-card .bc-owner svg{width:12px;height:12px;flex:none}

/* ============ 网易云歌单卡片 ============ */
.playlist-card{
  border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);
}
.pl-head{
  display:flex;align-items:center;gap:11px;padding:11px 14px;
  background:var(--accent-wash);color:var(--accent-ink);text-decoration:none;
}
.plh-icon{
  width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--accent);color:var(--card);
}
.plh-icon svg{width:17px;height:17px}
.plh-text{display:flex;flex-direction:column;min-width:0;flex:1}
.plh-name{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plh-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plh-go{flex:none;color:var(--accent);opacity:.8}
.plh-go svg{width:16px;height:16px}
.pl-head:hover .plh-go{opacity:1}
.pl-tracks{padding:5px 7px}
.pl-row{
  display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;
  color:var(--ink);text-decoration:none;
}
.pl-row:hover{background:var(--paper-deep)}
.pl-idx{width:22px;flex:none;text-align:center;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pl-cover{width:40px;height:40px;flex:none;border-radius:6px;object-fit:cover;background:var(--paper-deep)}
.pl-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.pl-title{font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pl-vip{
  flex:none;font-size:10px;line-height:1;padding:3px 4px;border-radius:4px;
  color:var(--danger);border:1px solid var(--danger);
}
.pl-dur{flex:none;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pl-row.pl-extra{display:none}
.playlist-card.open .pl-row.pl-extra{display:flex}
.pl-toggle{
  width:100%;padding:10px;border:none;border-top:1px dashed var(--line);
  background:transparent;color:var(--accent);font-family:var(--sans);font-size:12.5px;cursor:pointer;
}
.pl-toggle:hover{background:var(--paper-deep)}
/* 编辑器里的歌单预览 */
.pl-pending{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}

/* 头部：歌单名区为可点链接，视图切换为独立按钮 */

.playlist-card.grid .pl-tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:11px;padding:12px}

/* 单曲卡片 */
.song-card{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);text-decoration:none}
.sc-cover{width:54px;height:54px;flex:none;border-radius:9px;object-fit:cover;background:var(--paper-deep)}

/* 单曲编辑器预览 */
.ps-pending{position:relative;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:9px 34px 9px 10px;background:var(--card)}
.ps-pending .remove{position:absolute;top:6px;right:7px;width:22px;height:22px;border-radius:6px;background:rgba(0,0,0,.28);color:#fff;font-size:14px;line-height:1;z-index:2}

.ps-title{font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media(max-width:480px){
  .playlist-card.grid .pl-tracks{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}

/* 单曲卡片改为容器（主信息可点 + 歌词按钮） */
.song-card{flex-wrap:wrap}

/* 歌词面板 */

.lp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.lp-title{font-size:12.5px;font-weight:500;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;

}

}

}

/* ============ 页脚 ============ */
.footer{border-top:1px solid var(--line);padding:30px 0 46px;color:var(--ink-3);font-size:12.5px}

/* ============ 编辑模态框 ============ */
.modal{
  position:fixed;inset:0;z-index:60;display:none;

  padding:50px 20px 40px;overflow-y:auto;
}

.modal-pane{

  box-shadow:0 30px 70px -20px rgba(0,0,0,.45);

}
@keyframes modalIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.modal-pane input.m-link.show{display:block}
.modal-pane input.m-tags{margin:10px 20px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:13.5px;width:calc(100% - 40px)}
.modal-pane .m-tags:focus{border-color:var(--accent)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);margin-top:14px}
/* 账户 */
.account-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-family:var(--sans);font-size:13px;margin-right:auto;margin-left:2px;flex-shrink:0;min-width:0;max-width:52%}

.account-btn .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-btn:hover{border-color:var(--line-strong)}

/* ============ 图片灯箱 ============ */
.lightbox{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:rgba(9,10,12,.93)}
.lightbox.show{display:flex}
.lightbox img{max-width:91vw;max-height:84vh;border-radius:6px;animation:lbIn .2s ease}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.lb-btn{
  position:absolute;width:52px;height:52px;border-radius:50%;

  font-size:26px;transition:background .15s;
}

/* ============ Toast ============ */
.toast-wrap{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:10px;font-size:13.5px;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.4);
  animation:toastIn .25s ease;max-width:88vw;
}
.toast.warn{background:var(--danger);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* 无障碍 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

}

<script>
(function(){
'use strict';

/* ============ 常量与状态 ============ */
const DB_NAME='lingyin.db.v1';
const DB_VERSION=2;
const LEGACY_KEY='mosi.thoughts.v1';
const THEME_KEY='mosi.theme';
const ACCOUNT_KEY='lingyin.account.v1';
const MIGRATE_FLAG='lingyin.migrated.v1';
const JSZIP_URL='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';

let notes=[];
let accounts=[];
let currentAccountId=null;
let activeTag=null, query='', editingId=null;
const urlCache=new Map();
const deleteTimers=new Map();
const $=id=>document.getElementById(id);
function makeEditorState(){return {media:[],link:null};}
const cState=makeEditorState();
const mState=makeEditorState();

/* ============ IndexedDB 封装 ============ */
let dbPromise=null;
function openDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('notes')){
        const s=db.createObjectStore('notes',{keyPath:'id'});
        s.createIndex('updatedAt','updatedAt');
      }
      if(!db.objectStoreNames.contains('blobs')){
        db.createObjectStore('blobs',{keyPath:'id'});
      }
      if(!db.objectStoreNames.contains('accounts')){
        db.createObjectStore('accounts',{keyPath:'id'});
      }
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=()=>reject(req.error);
  });
  return dbPromise;
}
function storeOf(name,mode){return openDB().then(db=>db.transaction(name,mode).objectStore(name));}
function pReq(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
function dbPut(store,value){return storeOf(store,'readwrite').then(s=>pReq(s.put(value)));}
function dbGet(store,key){return storeOf(store,'readonly').then(s=>pReq(s.get(key)));}
function dbDel(store,key){return storeOf(store,'readwrite').then(s=>pReq(s.delete(key)));}
function dbAll(store){return storeOf(store,'readonly').then(s=>pReq(s.getAll()));}

async function getMediaURL(mediaId){
  if(urlCache.has(mediaId))return urlCache.get(mediaId);
  const row=await dbGet('blobs',mediaId);
  if(!row)return '';
  const url=URL.createObjectURL(row.blob);
  urlCache.set(mediaId,url);
  return url;
}

/* ============ 本地账户 ============ */
// 密码加盐 SHA-256（本地简单锁，非高强度加密；密码可留空）
async function hashPassword(password,salt){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'::'+password));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function createAccount(name,password){
  const id=uid(),salt=uid();
  const acc={
    id,
    name:String(name||'').trim().slice(0,24)||('空间'+(accounts.length+1)),
    salt,
    passwordHash:password?await hashPassword(password,salt):'',
    createdAt:new Date().toISOString()
  };
  await dbPut('accounts',acc);
  accounts.push(acc);
  return acc;
}
async function verifyPassword(acc,password){
  if(!acc.passwordHash)return true;
  return (await hashPassword(password||'',acc.salt))===acc.passwordHash;
}
function getAccount(id){return accounts.find(a=>a.id===id)||null;}
function saveCurrentAccount(){
  try{localStorage.setItem(ACCOUNT_KEY,currentAccountId||'');}catch(e){}
}
function updateAccountBtn(){
  const acc=getAccount(currentAccountId);const btn=$('btnAccount');
  if(acc&&btn){btn.querySelector('.label').textContent=acc.name;btn.title='当前账户：'+acc.name+'（点击切换）';}
}
// 载入某账户的想法并刷新界面
async function loadAccount(id){
  const acc=getAccount(id);if(!acc)return;
  currentAccountId=id;saveCurrentAccount();
  activeTag=null;query='';$('searchInput').value='';$('searchBox').classList.remove('has-text');
  resetComposer(true);
  let rows=[];
  try{rows=await dbAll('notes');}catch(e){rows=[];}
  notes=rows.filter(n=>n.ownerId===id);
  updateAccountBtn();
  render();updateQuota();
}

/* ============ 账户界面 ============ */
function openAccountModal(){renderAccountList();$('accountModal').classList.add('show');}
function closeAccountModal(){$('accountModal').classList.remove('show');}
async function renderAccountList(){
  $('amTitle').textContent='选择账户';
  const all=await dbAll('notes');
  const countOf=id=>all.filter(n=>n.ownerId===id).length;
  const body=$('amBody');body.innerHTML='';
  const list=document.createElement('div');list.className='acc-list';
  accounts.forEach(a=>{
    const item=document.createElement('div');
    item.className='acc-item'+(a.id===currentAccountId?' current':'');
    const avatar=document.createElement('span');avatar.className='ai-avatar';avatar.textContent=a.name.slice(0,1);
    const meta=document.createElement('span');meta.className='ai-meta';
    const nm=document.createElement('span');nm.className='ai-name';nm.textContent=a.name;
    const sub=document.createElement('span');sub.className='ai-sub';
    sub.textContent=countOf(a.id)+' 则想法'+(a.id===currentAccountId?' · 当前':(a.passwordHash?' · 已上锁':''));
    const ops=document.createElement('span');ops.className='ai-ops';
    const del=document.createElement('button');del.className='ai-del';del.title='删除账户';
    del.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    del.addEventListener('click',e=>{e.stopPropagation();renderDeleteAccount(a);});
    const mark=document.createElement('span');mark.className='ai-mark';
    mark.innerHTML=a.passwordHash
      ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
      :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
    ops.appendChild(del);ops.appendChild(mark);
    meta.appendChild(nm);meta.appendChild(sub);
    item.appendChild(avatar);item.appendChild(meta);item.appendChild(ops);
    item.addEventListener('click',()=>chooseAccount(a));
    list.appendChild(item);
  });
  body.appendChild(list);
  const newBtn=document.createElement('button');newBtn.className='acc-new';
  newBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建账户';
  newBtn.addEventListener('click',renderAccountCreate);
  body.appendChild(newBtn);
  const more=document.createElement('div');more.className='acc-more';
  more.innerHTML='<div class="am-more-title">当前账户操作</div>';
  const row=document.createElement('div');row.className='am-more-row';
  const mk=t=>{const b=document.createElement('button');b.className='am-more-btn';b.textContent=t;return b;};
  const curAcc=getAccount(currentAccountId);
  const canShare=!!(curAcc&&curAcc.name.trim()==='EchoZero澪音');
  const b1=mk('清空想法');b1.addEventListener('click',renderClearConfirm);
  const b2=mk('生成分享包');b2.addEventListener('click',renderShareCreate);
  const b3=mk('加载分享');b3.addEventListener('click',renderCloudLoad);
  const b4=mk('修改密码');b4.addEventListener('click',renderChangePassword);
  row.appendChild(b1);
  if(canShare)row.appendChild(b2);
  row.appendChild(b3);row.appendChild(b4);
  more.appendChild(row);body.appendChild(more);
}
function chooseAccount(a){
  if(a.id===currentAccountId){closeAccountModal();return;}
  if(a.passwordHash)renderUnlock(a);
  else{closeAccountModal();loadAccount(a.id).then(()=>toast('已进入「'+a.name+'」'));}
}
function renderUnlock(a){
  $('amTitle').textContent='进入「'+a.name+'」';
  const body=$('amBody');
  body.innerHTML=
    '<div class="am-form">'
    +'<label>密码</label>'
    +'<input type="password" id="amPassword" placeholder="请输入该账户的密码" autocomplete="off">'
    +'<div class="am-error" id="amError"></div>'
    +'<div class="am-actions">'
    +'<button class="btn-ghost" id="amBack">返回</button>'
    +'<button class="btn-primary" id="amEnter">进入</button>'
    +'</div></div>';
  const input=$('amPassword');input.focus();
  const submit=async()=>{
    const ok=await verifyPassword(a,input.value);
    if(!ok){$('amError').textContent='密码不正确，请重试';input.select();return;}
    closeAccountModal();await loadAccount(a.id);toast('已进入「'+a.name+'」');
  };
  $('amEnter').addEventListener('click',submit);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  $('amBack').addEventListener('click',renderAccountList);
}
function renderAccountCreate(){
  $('amTitle').textContent='新建账户';
  const body=$('amBody');
  body.innerHTML=
    '<div class="am-form">'
    +'<label>账户名称</label>'
    +'<input type="text" id="amName" placeholder="例如：工作、个人、灵感…" maxlength="24" autocomplete="off">'
    +'<label>密码（可留空）</label>'
    +'<input type="password" id="amPass" placeholder="留空则进入时无需密码" autocomplete="new-password">'
    +'<div class="am-hint">账户与内容仅保存在本机浏览器；密码只用于简单上锁区分，并非高强度加密。</div>'
    +'<div class="am-actions">'
    +'<button class="btn-ghost" id="amBack">返回</button>'
    +'<button class="btn-primary" id="amCreate">创建并进入</button>'
    +'</div></div>';
  const nameInput=$('amName');nameInput.focus();
  const submit=async()=>{
    const acc=await createAccount(nameInput.value,$('amPass').value);
    closeAccountModal();await loadAccount(acc.id);toast('已创建并进入「'+acc.name+'」');
  };
  $('amCreate').addEventListener('click',submit);
  $('amPass').addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  nameInput.addEventListener('keydown',e=>{if(e.key==='13')$('amPass').focus();});
  $('amBack').addEventListener('click',renderAccountList);
}

/* ===== 删除账户 ===== */
function renderDeleteAccount(a){
  $('amTitle').textContent='删除账户';
  const body=$('amBody');
  body.innerHTML=
    '<div class="am-form">'
    +'<div class="am-progress">确定删除账户「<strong></strong>」吗？<br>该账户下的全部想法、图片与视频都会被永久删除，无法恢复。</div>'
    +'<div class="am-actions">'
    +'<button class="btn-ghost" id="amBack">取消</button>'
    +'<button class="btn-primary" id="amConfirm" style="background:var(--danger)">确认删除</button>'
    +'</div></div>';
  body.querySelector('strong').textContent=a.name;
  $('amConfirm').addEventListener('click',async()=>{
    const wasCurrent=a.id===currentAccountId;
    await deleteAccount(a);
    closeAccountModal();
    if(wasCurrent&&!accounts.some(x=>!x.passwordHash)&&accounts.length)openAccountModal();
  });
  $('amBack').addEventListener('click',renderAccountList);
}
async function deleteAccount(a){
  const all=await dbAll('notes');
  for(const n of all){
    if(n.ownerId!==a.id)continue;
    for(const m of n.media){
      await dbDel('blobs',m.id);
      const u=urlCache.get(m.id);if(u){URL.revokeObjectURL(u);urlCache.delete(m.id);}
    }
    await dbDel('notes',n.id);
  }
  await dbDel('accounts',a.id);
  accounts=accounts.filter(x=>x.id!==a.id);
  if(a.id===currentAccountId){
    currentAccountId=null;saveCurrentAccount();
    const free=accounts.find(x=>!x.passwordHash);
    if(free)await loadAccount(free.id);
    else if(accounts.length){notes=[];render();updateQuota();}
    else{const def=await createAccount('默认空间','');await loadAccount(def.id);}
  }
}

/* ===== 一键清空当前账户 ===== */
function renderClearConfirm(){
  $('amTitle').textContent='清空想法';

/* ===== 云端加密分享（AES-GCM） ===== */
function bufToB64(buf){let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function b64ToBuf(str){const s=atob(str);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
function blobToDataURL(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob);});}
function dataURLToBlob(durl){
  const parts=durl.split(',');const mt=/data:(.*?);/.exec(parts[0]);
  const s=atob(parts[1]);const a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return new Blob([a],{type:mt?mt[1]:''});
}
async function shareKey(password,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptShare(payload,answer,question){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await shareKey(answer,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload)));
  return {format:'lingyin-share',version:2,question:question||'',salt:bufToB64(salt),iv:bufToB64(iv),data:bufToB64(ct),exportedAt:new Date().toISOString()};
}
async function decryptShare(pkg,answer){
  const key=await shareKey(answer,b64ToBuf(pkg.salt));
  let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBuf(pkg.iv)},key,b64ToBuf(pkg.data));}
  catch(e){throw new Error('答案错误或数据包已损坏');}
  return JSON.parse(new TextDecoder().decode(pt));
}
async function buildSharePayload(){
  const acc=getAccount(currentAccountId);
  const outNotes=[];
  for(const n of notes){
    const media=[];
    for(const m of n.media){
      const row=await dbGet('blobs',m.id);
      media.push({id:m.id,kind:m.kind,name:m.name,type:m.type,size:m.size,dataUrl:row?await blobToDataURL(row.blob):''});
    }
    outNotes.push({id:n.id,title:n.title,body:n.body,tags:n.tags,link:n.link,createdAt:n.createdAt,updatedAt:n.updatedAt,media});
  }
  return {format:'lingyin-share-data',version:1,accountName:acc?acc.name:'',exportedAt:new Date().toISOString(),notes:outNotes};
}
async function applySharePayload(p,onProgress){
  let acc=accounts.find(a=>a.cloud&&a.cloudName===p.accountName);
  if(!acc){
    acc={id:uid(),name:p.accountName||'云端分享',salt:'',passwordHash:'',createdAt:new Date().toISOString(),cloud:true,cloudName:p.accountName||''};
    await dbPut('accounts',acc);accounts.push(acc);
  }
  const list=p.notes||[];
  const blobJobs=[];
  const noteRecs=[];
  list.forEach(n=>{
    const media=[];
    (n.media||[]).forEach(m=>{
      media.push({id:m.id,kind:m.kind,name:m.name||'',type:m.type||'',size:m.size||0});
      if(m.dataUrl)blobJobs.push(async()=>{try{await dbPut('blobs',{id:m.id,blob:dataURLToBlob(m.dataUrl)});}catch(e){}});
    });
    noteRecs.push({id:n.id,ownerId:acc.id,title:n.title||'',body:n.body||'',tags:Array.isArray(n.tags)?n.tags:[],link:n.link||null,media,createdAt:n.createdAt,updatedAt:n.updatedAt});
  });
  const BATCH=16,total=blobJobs.length;let done=0;
  for(let i=0;i<total;i+=BATCH){
    await Promise.all(blobJobs.slice(i,i+BATCH).map(j=>j()));
    done+=Math.min(BATCH,total-i);
    if(onProgress)try{onProgress(done,total);}catch(e){}
  }
  await Promise.all(noteRecs.map(r=>dbPut('notes',r)));
  await loadAccount(acc.id);
}

/* ============ 工具函数 ============ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function parseTags(str){
  const raw=str.split(/[,，、;；\s]+/).map(t=>t.replace(/^#+/,'').trim()).filter(Boolean);
  return [...new Set(raw)].slice(0,8).map(t=>t.slice(0,12));
}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(iso){
  const d=new Date(iso);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function relativeTime(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000);
  if(m<1)return '刚刚';
  if(m<60)return m+' 分钟前';
  const h=Math.floor(m/60);
  if(h<24)return h+' 小时前';
  const d=Math.floor(h/24);
  if(d<7)return d+' 天前';
  const dt=new Date(iso);
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}
function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms);};}
function fileStamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());}
function fmtSize(n){
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(0)+' KB';
  if(n<1073741824)return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
function safeExt(m){
  if(m.name){const e=/\.([a-z0-9]{1,5})$/i.exec(m.name);if(e)return '.'+e[1].toLowerCase();}
  const map={'image/png':'.png','image/jpeg':'.jpg','image/gif':'.gif','image/webp':'.webp','video/mp4':'.mp4','video/webm':'.webm','video/quicktime':'.mov'};
  return map[m.type]||(m.kind==='image'?'.img':'.vid');
}
function downloadBlob(filename,blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function normalizeURL(raw){
  let s=String(raw||'').trim();
  if(!s)return null;
  if(!/^https?:\/\//i.test(s))s='https://'+s;
  let u;try{u=new URL(s);}catch(e){return null;}
  if(u.protocol!=='http:'&&u.protocol!=='https:')return null;
  return {url:u.href,title:u.hostname.replace(/^www\./,'')};
}

/* ============ B站视频解析 ============ */
// 识别输入文本中的B站视频：{kind:'bvid'|'aid',id} 或 {kind:'short',code} 或 null
function detectBili(raw){
  const s=String(raw||'').trim();
  if(!s)return null;
  let m=s.match(/b23\.tv\/(BV[0-9A-Za-z]{10})/i);
  if(m)return {kind:'bvid',id:m[1]};
  m=s.match(/b23\.tv\/([0-9A-Za-z]+)/);
  if(m)return {kind:'short',code:m[1]};
  m=s.match(/\/video\/(BV[0-9A-Za-z]{10})/i);
  if(m)return {kind:'bvid',id:m[1]};
  m=s.match(/\/video\/av(\d+)/i);
  if(m)return {kind:'aid',id:m[1]};
  m=s.match(/(^|[^0-9A-Za-z])(BV[0-9A-Za-z]{10})([^0-9A-Za-z]|$)/);
  if(m)return {kind:'bvid',id:m[2]};
  m=s.match(/(^|[^0-9A-Za-z])av(\d+)([^0-9A-Za-z]|$)/i);
  if(m)return {kind:'aid',id:m[2]};
  return null;
}
// JSONP 请求（script 标签不受同源策略限制）
function biliJSONP(url){
  return new Promise((resolve,reject)=>{
    const cb='__bili_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    const sc=document.createElement('script');
    let done=false;
    function cleanup(){delete window[cb];if(sc.parentNode)sc.remove();clearTimeout(timer);}
    window[cb]=data=>{if(done)return;done=true;resolve(data);cleanup();};
    sc.onerror=()=>{if(done)return;done=true;reject(new Error('网络请求失败'));cleanup();};
    const timer=setTimeout(()=>{if(done)return;done=true;reject(new Error('解析超时'));cleanup();},12000);
    sc.src=url+'&jsonp=jsonp&callback='+cb;
    document.head.appendChild(sc);
  });
}
// b23.tv 随机短码展开：多代理依次尝试
async function expandBiliShort(code){
  const target='https://b23.tv/'+code;
  const makers=[
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),
    u=>'https://www.cors-anywhere.com/'+u,
    u=>'https://cors.lol/'+u,
    u=>'https://crossorigin.me/'+u
  ];
  for(const mk of makers){
    try{
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),9000);
      const r=await fetch(mk(target),{signal:ctrl.signal});clearTimeout(to);
      if(!r.ok)continue;
      const txt=await r.text();
      const m=txt.match(/BV[0-9A-Za-z]{10}/);
      if(m)return m[0];
    }catch(e){/* 继续尝试下一个代理 */}
  }
  throw new Error('短链自动展开失败');
}
// 通道一：开放解析接口（CORS 开放，支持完整链接/BV/AV/b23短链）
async function resolveBiliViaAPI(raw){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),12000);
  let r;
  try{
    r=await fetch('https://blbl.l2.ink/api.php?url='+encodeURIComponent(raw)+'&mode=single',{signal:ctrl.signal});
  }finally{clearTimeout(to);}
  if(!r.ok)throw new Error('解析服务请求失败');
  const j=await r.json();
  if(!j||j.code!==200||!j.data)throw new Error((j&&j.msg)||'解析失败');
  const d=j.data;
  if(d.type!=='video'||!d.bvid)throw new Error('暂只支持视频链接');
  const pic=String((d.cover&&d.cover.default)||'').replace(/^http:\/\//,'https://');
  return {
    url:'https://www.bilibili.com/video/'+d.bvid+'/',
    title:d.title,
    bili:{
      bvid:d.bvid,aid:d.aid,pic,
      owner:(d.owner&&d.owner.name)||'',
      duration:0
    }
  };
}
// 主入口：B站链接/BV/AV/短链 -> 含封面标题的 link 对象
async function resolveBili(raw){
  // 优先开放接口（对短链最可靠）
  try{return await resolveBiliViaAPI(raw);}catch(e){}
  // 降级：官方 JSONP（不支持随机短链）
  const info=detectBili(raw);
  if(!info)return null;
  if(info.kind==='short')throw new Error('短链自动解析失败，请粘贴完整链接或BV号');
  const api='https://api.bilibili.com/x/web-interface/view?'
    +(info.kind==='bvid'?('bvid='+info.id):('aid='+info.id));
  const d=await biliJSONP(api);
  if(!d||d.code!==0||!d.data)throw new Error((d&&d.message)||'视频解析失败');
  const data=d.data;
  const pic=(data.pic||'').replace(/^http:\/\//,'https://');
  return {
    url:'https://www.bilibili.com/video/'+data.bvid+'/',
    title:data.title,
    bili:{
      bvid:data.bvid,aid:data.aid,pic,
      owner:(data.owner&&data.owner.name)||'',
      duration:data.duration||0
    }
  };
}

// 识别网易云歌单链接（含 #/playlist、/m/playlist、?id=、/playlist/数字）
function detectNeteasePlaylist(raw){
  const s=String(raw||'');
  if(!/music\.163\.com/.test(s))return null;
  if(!/playlist/.test(s))return null;
  let m=s.match(/[?&]id=(\d+)/);
  if(!m)m=s.match(/playlist\/(\d+)/);
  if(!m)return null;
  return {id:m[1]};
}
function fmtDur(sec){
  sec=Number(sec)||0;const m=Math.floor(sec/60),s=sec%60;
  return m+':'+(s<10?('0'+s):s);
}
// 封面缩略图：网易云图床按 param 返回小图（卡片 40px→80，预览 32px→64）
function neteasePic(u,size){
  u=String(u||'');if(!u)return u;
  return u+(u.includes('?')?'&':'?')+'param='+size+'y'+size;
}
// 拉取歌单歌曲表（xfyun 开放接口，CORS *，topId 可传任意歌单 id）
async function resolveNeteasePlaylist(raw){
  const info=detectNeteasePlaylist(raw);
  if(!info)return null;
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),20000);
  let r;
  try{
    r=await fetch('https://music.api.xfyun.club/api/v1/music/top?platform=netease&topId='+info.id,{signal:ctrl.signal});
  }finally{clearTimeout(to);}
  if(!r.ok)throw new Error('歌单加载失败');
  const j=await r.json();
  if(!j||j.code!==200||!Array.isArray(j.data)||!j.data.length)throw new Error('歌单解析失败或为空');
  const songs=j.data.map(x=>({
    id:String(x.id),
    title:x.title||'未知曲目',
    artist:x.artist||'未知歌手',
    album:x.album||'',
    cover:String(x.cover||'').replace(/^http:\/\//,'https://'),
    duration:Number(x.duration)||0,
    pay:!!x.pay
  }));
  const url='https://music.163.com/#/playlist?id='+info.id;
  return {
    url,title:'网易云歌单',
    playlist:{id:info.id,name:'网易云歌单',url,songCount:songs.length,view:'list',open:false,fetchedAt:new Date().toISOString(),songs}
  };
}
// 识别单曲链接（#/song、/m/song、?id=、/song/数字）
function detectNeteaseSong(raw){
  const s=String(raw||'');
  if(!/music\.163\.com/.test(s))return null;
  if(!/song/.test(s))return null;
  let m=s.match(/[?&]id=(\d+)/);
  if(!m)m=s.match(/song\/(\d+)/);
  if(!m)return null;
  return {id:m[1]};
}
// 拉取单曲
async function resolveNeteaseSong(raw){
  const info=detectNeteaseSong(raw);
  if(!info)return null;
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),15000);
  let r;

    r=await fetch('https://music.api.xfyun.club/api/v1/music/song?platform=netease&songId='+info.id,{signal:ctrl.signal});
  }finally{clearTimeout(to);}
  if(!r.ok)throw new Error('歌曲加载失败');
  const j=await r.json();
  const x=j&&j.data;
  if(!x||!x.id)throw new Error('歌曲解析失败');
  const song={id:String(x.id),title:x.title||'未知曲目',artist:x.artist||'未知歌手',album:x.album||'',
    cover:String(x.cover||'').replace(/^http:\/\//,'https://'),duration:Number(x.duration)||0,pay:!!x.pay};

}

/* ============ 歌词 ============ */
const lyricSel={};
// LRC 解析（一行可含多个时间戳），返回 [{time(ms),text}]
function parseLRC(lrc){
  const out=[];
  String(lrc||'').split('\n').forEach(line=>{
    const re=/\[(\d+):(\d+)(?:[.:](\d+))?\]/g;let m;const tags=[];
    while((m=re.exec(line)))tags.push(m);
    const text=line.replace(re,'').trim();
    tags.forEach(t=>{
      const ms=t[3]?Math.round(parseFloat('0.'+t[3])*1000):0;
      out.push({time:(+t[1])*60000+(+t[2])*1000+ms,text});
    });
  });
  return out.sort((a,b)=>a.time-b.time);
}
// 按需拉取并固化歌词到 song（原文 lyrics、翻译 tlyric，均为平行文本数组）
async function openLyric(song){
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),12000);
  let r;
  try{
    r=await fetch('https://music.api.xfyun.club/api/v1/music/lyric?platform=netease&songId='+song.id,{signal:ctrl.signal});
  }finally{clearTimeout(to);}
  if(!r.ok)throw new Error('歌词加载失败');
  const j=await r.json();const d=j&&j.data;
  if(!d)throw new Error('歌词解析失败');
  const lines=Array.isArray(d.lines)&&d.lines.length?d.lines:parseLRC(d.lyric);
  song.lyrics=lines.map(x=>x.text);
  song.tlyric=null;
  if(d.translatedLyric){
    const tl=parseLRC(d.translatedLyric);
    if(tl.length){
      song.tlyric=lines.map(l=>{
        let best=null,bd=1e9;
        tl.forEach(t=>{const dd=Math.abs(t.time-l.time);if(dd<bd){bd=dd;best=t;}});
        return (best&&bd<900)?best.text:'';
      });
    }
  }
}
function fillLyric(body,song){
  body.innerHTML='';
  const L=song.lyrics||[];
  if(!L.length){body.innerHTML='<div class="lr-empty">暂无歌词（可能为纯音乐）</div>';return;}
  L.forEach((t,i)=>{
    const d=document.createElement('div');d.className='lr-line';
    d.textContent=t.trim()?t:'♪';body.appendChild(d);
    if(song.tlyric&&song.tlyric[i]){
      const tr=document.createElement('div');tr.className='lr-tr';tr.textContent=song.tlyric[i];body.appendChild(tr);
    }
  });
}
// 面板显示：已缓存直接填，否则加载、固化并持久化 note
async function ensureLyric(panel,song,note){
  const body=panel.querySelector('.lp-body');
  if(Array.isArray(song.lyrics)){fillLyric(body,song);return;}
  body.innerHTML='<div class="lr-loading"><span class="spin"></span>正在加载歌词…</div>';
  try{
    await openLyric(song);fillLyric(body,song);
    if(note){try{await dbPut('notes',note);}catch(e){}}
  }catch(e){body.innerHTML='<div class="lr-empty">歌词加载失败，请检查网络后重试</div>';}
}

/* ============ 数据筛选 ============ */
function getFiltered(){
  let list=notes.slice();
  if(activeTag)list=list.filter(n=>n.tags.includes(activeTag));
  if(query){
    const q=query.toLowerCase();
    list=list.filter(n=>{
      let link='';
      if(n.link){
        link=n.link.url+' '+n.link.title;
        if(n.link.playlist){const pl=n.link.playlist;link+=' '+pl.name+' '+pl.songs.map(s=>s.title+' '+s.artist+' '+s.album).join(' ');}
        if(n.link.song){const g=n.link.song;link+=' '+g.title+' '+g.artist+' '+g.album;}
        if(n.link.bili)link+=' '+n.link.bili.owner;
      }
      return (n.title+'\n'+n.body+'\n'+n.tags.join(' ')+'\n'+link).toLowerCase().includes(q);
    });
  }
  list.sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));
  return list;
}
function tagCounts(){
  const m=new Map();
  notes.forEach(n=>n.tags.forEach(t=>m.set(t,(m.get(t)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

    has=true;
    const item=document.createElement('div');item.className='pending-item';
    if(m.kind==='image'){
      const img=document.createElement('img');img.src=m.url;img.alt=m.name;

      const fb=document.createElement('div');fb.className='file-fallback';

function addFiles(state,files,kind,boxId){
  files.forEach(f=>{
    if(kind==='image'&&!f.type.startsWith('image/'))return;
    if(kind==='video'&&!f.type.startsWith('video/'))return;
    const id=uid();
    const url=URL.createObjectURL(f);
    state.media.push({id,kind,name:f.name,type:f.type,size:f.size,file:f,url});
    if(kind==='video'&&f.size>104857600){
      toast('视频较大（'+fmtSize(f.size)+'），保存与备份会需要一些时间');
    }
  });
  renderPending(state,boxId);
}
function bindFilePicker(btnId,inputId,state,boxId,kind){
  $(btnId).addEventListener('click',()=>$(inputId).click());
  $(inputId).addEventListener('change',e=>{
    addFiles(state,Array.from(e.target.files),kind,boxId);
    e.target.value='';
  });
}
/* 统一的链接提交：B站链接自动解析封面标题，普通链接走原逻辑 */
async function applyLinkInput(state,inputId,boxId){
  const input=$(inputId);
  const raw=input.value.trim();
  if(!raw)return true;
  if(detectBili(raw)){
    state.linkSeq=(state.linkSeq||0)+1;const seq=state.linkSeq;
    state.link={loading:true,url:raw,title:''};
    renderPending(state,boxId);
    try{
      const l=await resolveBili(raw);
      if(state.linkSeq===seq)state.link=l;
    }catch(e){
      if(state.linkSeq===seq){
        state.link=normalizeURL(raw);
        toast('B站视频信息加载失败，已按普通链接收藏','warn');
      }
    }
    if(state.linkSeq===seq)renderPending(state,boxId);
    return true;
  }
  if(detectNeteasePlaylist(raw)){
    state.linkSeq=(state.linkSeq||0)+1;const seq=state.linkSeq;
    state.link={loading:true,url:raw,title:''};
    renderPending(state,boxId);
    try{
      const l=await resolveNeteasePlaylist(raw);
      if(state.linkSeq===seq)state.link=l;
    }catch(e){
      if(state.linkSeq===seq){
        state.link=normalizeURL(raw);
        toast('网易云歌单加载失败，已按普通链接收藏','warn');
      }
    }
    if(state.linkSeq===seq)renderPending(state,boxId);
    return true;
  }
  if(detectNeteaseSong(raw)){
    state.linkSeq=(state.linkSeq||0)+1;const seq=state.linkSeq;
    state.link={loading:true,url:raw,title:''};
    renderPending(state,boxId);
    try{
      const l=await resolveNeteaseSong(raw);
      if(state.linkSeq===seq)state.link=l;
    }catch(e){
      if(state.linkSeq===seq){
        state.link=normalizeURL(raw);
        toast('网易云歌曲加载失败，已按普通链接收藏','warn');
      }
    }
    if(state.linkSeq===seq)renderPending(state,boxId);
    return true;
  }
  const l=normalizeURL(raw);
  if(!l){toast('链接格式不正确','warn');return false;}
  state.link=l;
  renderPending(state,boxId);
  return true;
}
function bindLinkToggle(btnId,inputId,state,boxId){
  const input=$(inputId);
  $(btnId).addEventListener('click',()=>{
    const show=input.classList.toggle('show');
    $(btnId).classList.toggle('on',show);
    if(show)input.focus();
  });
  let suppress=false;
  input.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();suppress=true;
      applyLinkInput(state,inputId,boxId).then(()=>{
        input.blur();setTimeout(()=>suppress=false,120);
      });
    }
  });
  input.addEventListener('blur',()=>{
    if(suppress)return;
    if(input.value.trim())applyLinkInput(state,inputId,boxId);
  });
}

async function openEdit(id){
  const note=notes.find(n=>n.id===id);if(!note)return;
  editingId=id;
  discardState(mState);
  $('mTitle').value=note.title;
  $('mBody').value=note.body;
  $('mTags').value=note.tags.join(' ');
  $('mLink').value=note.link?note.link.url:'';
  $('mLink').classList.toggle('show',!!note.link);
  $('mAddLink').classList.toggle('on',!!note.link);
  for(const m of note.media){
    const url=await getMediaURL(m.id);
    mState.media.push({id:m.id,kind:m.kind,name:m.name,type:m.type,size:m.size,file:null,url:url});
  }

  renderPending(mState,'mPending');
  $('modal').classList.add('show');
  setTimeout(()=>$('mBody').focus(),0);
}
function discardState(state){
  state.media.forEach(m=>{if(m.file)URL.revokeObjectURL(m.url);});
  state.media=[];state.link=null;
}
function closeModal(){
  $('modal').classList.remove('show');
  discardState(mState);
  editingId=null;
}
async function saveEdit(){
  const note=notes.find(n=>n.id===editingId);
  if(!note){closeModal();return;}
  if(!await applyLinkInput(mState,'mLink','mPending'))return;
  const title=$('mTitle').value.trim();
  const body=$('mBody').value.trim();
  const tags=parseTags($('mTags').value);
  if(!title&&!body&&!mState.media.length&&!mState.link){
    toast('想法不能是空白的','warn');return;
  }
  const keep=new Set(mState.media.map(m=>m.id));
  for(const old of note.media){
    if(!keep.has(old.id)){
      await dbDel('blobs',old.id);
      const u=urlCache.get(old.id);
      if(u){URL.revokeObjectURL(u);urlCache.delete(old.id);}
    }
  }
  for(const m of mState.media){
    if(m.file)await dbPut('blobs',{id:m.id,blob:m.file});
  }
  note.title=title;note.body=body;note.tags=tags;
  note.link=mState.link;
  note.media=mState.media.map(m=>({id:m.id,kind:m.kind,name:m.name,type:m.type,size:m.size}));
  note.updatedAt=new Date().toISOString();
  await dbPut('notes',note);
  closeModal();render();updateQuota();
  toast('修改已保存');
}

function armDelete(btn,id){
  if(btn.dataset.confirm==='1'){doDelete(id);return;}
  btn.dataset.confirm='1';
  btn.textContent='确认删除？';
  const timer=setTimeout(()=>{btn.dataset.confirm='';btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除';},2600);
  deleteTimers.set(id,timer);
}
async function doDelete(id){
  const timer=deleteTimers.get(id);
  if(timer){clearTimeout(timer);deleteTimers.delete(id);}
  const note=notes.find(n=>n.id===id);
  if(note){
    for(const m of note.media){
      await dbDel('blobs',m.id);
      const u=urlCache.get(m.id);
      if(u){URL.revokeObjectURL(u);urlCache.delete(m.id);}
    }
  }
  await dbDel('notes',id);
  notes=notes.filter(n=>n.id!==id);
  render();updateQuota();
  toast('已删除这则想法');
}

let jszipPromise=null;

    const s=document.createElement('script');
    s.src=url;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}

/* ============ ZIP 导出 ============ */
async function exportZip(){
  const allNotes=await dbAll('notes');
  if(!allNotes.length){toast('还没有内容可以备份','warn');return;}
  toast('正在打包全部账户，请稍候…');
  let JSZip;
  try{await loadJSZip();JSZip=window.JSZip;}
  catch(e){toast('打包组件加载失败，请检查网络后重试','warn');return;}
  const zip=new JSZip();
  const folder=zip.folder('media');
  for(const note of allNotes){
    for(const m of note.media){
      const row=await dbGet('blobs',m.id);
      if(!row)continue;
      folder.file(m.id+safeExt(m),row.blob,{compression:'STORE'});
    }
  }
  const clean=allNotes.map(n=>({
    id:n.id,ownerId:n.ownerId,title:n.title,body:n.body,tags:n.tags,link:n.link,
    createdAt:n.createdAt,updatedAt:n.updatedAt,
    media:n.media.map(m=>({id:m.id,kind:m.kind,name:m.name,type:m.type,size:m.size,file:'media/'+m.id+safeExt(m)}))
  }));
  const accData=accounts.map(a=>({id:a.id,name:a.name,salt:a.salt,passwordHash:a.passwordHash,createdAt:a.createdAt}));
  const meta={app:'澪音',owner:'EchoZero',version:4,exportedAt:new Date().toISOString(),accounts:accData,notes:clean};
  zip.file('notes.json',JSON.stringify(meta,null,2));
  const blob=await zip.generateAsync({type:'blob'});
  downloadBlob('澪音全量备份-'+fileStamp()+'.zip',blob);
  toast('备份 ZIP 已开始下载');
}

/* ============ ZIP 导入 ============ */
async function importZip(file){
  let JSZip;
  try{await loadJSZip();JSZip=window.JSZip;}
  catch(e){toast('组件加载失败，请检查网络后重试','warn');return;}
  try{
    const zip=await JSZip.loadAsync(file);
    const jf=zip.file('notes.json');
    if(!jf)throw new Error('bad zip');
    const data=JSON.parse(await jf.async('string'));
    const arr=data.notes;
    if(!Array.isArray(arr))throw new Error('bad data');
    // 还原账户（v4 含 accounts；旧备份无则用当前/默认账户兜底）
    const metaAcc=Array.isArray(data.accounts)?data.accounts:[];
    for(const a of metaAcc){
      if(!a||!a.id||getAccount(a.id))continue;
      const acc={id:a.id,name:a.name||'导入空间',salt:a.salt||uid(),passwordHash:a.passwordHash||'',createdAt:a.createdAt||new Date().toISOString()};
      await dbPut('accounts',acc);accounts.push(acc);
    }
    const fallbackOwner=(currentAccountId&&getAccount(currentAccountId))?currentAccountId:accounts[0].id;
    const existing=new Map((await dbAll('notes')).map(n=>[n.id,n]));
    let added=0,updated=0;
    for(const x of arr){
      if(!x||(!x.title&&!x.body&&!(x.media&&x.media.length)&&!x.link))continue;
      const id=x.id||uid();
      const media=[];
      for(const m of (x.media||[])){
        const mid=m.id||uid();
        if(m.file){
          const mf=zip.file(m.file);
          if(mf){
            const b=await mf.async('blob');
            await dbPut('blobs',{id:mid,blob:b});
          }
        }
        media.push({id:mid,kind:m.kind,name:m.name||'',type:m.type||'',size:m.size||0});
      }
      const ownerId=(x.ownerId&&getAccount(x.ownerId))?x.ownerId:fallbackOwner;
      const now=new Date().toISOString();
      const note={
        id,ownerId,title:x.title||'',body:x.body||'',
        tags:Array.isArray(x.tags)?x.tags:[],
        link:x.link||null,media,
        createdAt:x.createdAt||now,
        updatedAt:x.updatedAt||x.createdAt||now
      };
      await dbPut('notes',note);
      if(existing.has(id))updated++;else{added++;existing.set(id,note);}
    }
    await loadAccount(currentAccountId||fallbackOwner);
    toast('导入完成：新增 '+added+' 则，更新 '+updated+' 则');
  }catch(e){
    toast('导入失败：请选择「澪音」导出的备份 ZIP','warn');
  }
}

/* ============ Markdown 导出 ============ */
function exportMarkdown(){
  if(!notes.length){toast('还没有内容可以导出','warn');return;}
  const list=notes.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt));
  const accName=(getAccount(currentAccountId)||{}).name||'';
  let out='# 澪音 · 想法导出'+(accName?(' · '+accName):'')+'\n\n> 导出时间：'+fmtDate(new Date().toISOString())+'\n> 共 '+notes.length+' 则想法\n\n---\n\n';
  list.forEach(n=>{
    out+='## '+(n.title||'（无标题）')+'\n\n';
    out+='*'+fmtDate(n.createdAt)+'*\n\n';
    if(n.tags.length)out+=n.tags.map(t=>'#'+t).join(' ')+'\n\n';
    if(n.body)out+=n.body+'\n\n';
    n.media.filter(m=>m.kind==='image').forEach(()=>out+'> [图片]\n\n');
    n.media.filter(m=>m.kind==='video').forEach(m=>out+'> [视频'+(m.name?'：'+m.name:'')+']\n\n');
    if(n.link)out+='链接：['+(n.link.title||n.link.url)+']('+n.link.url+')\n\n';
    out+='---\n\n';
  });
  downloadBlob('澪音文稿-'+fileStamp()+'.md',new Blob([out],{type:'text/markdown;charset=utf-8'}));
  toast('Markdown 文稿已开始下载');
}

/* ============ 存储配额 ============ */
async function updateQuota(){
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      $('quotaText').textContent='已用 '+fmtSize(e.usage||0)+' / 约 '+fmtSize(e.quota||0);
    }
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persist().catch(()=>{});
    }
  }catch(e){}
}

/* ============ 主题 ============ */
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  $('iconMoon').style.display=theme==='dark'?'none':'';
  $('iconSun').style.display=theme==='dark'?'':'none';
  try{localStorage.setItem(THEME_KEY,theme);}catch(e){}
}

/* ============ Toast ============ */
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast'+(type==='warn'?' warn':'');
  el.textContent=msg;
  $('toastWrap').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260);},2400);
}

/* ============ 启动：迁移旧数据 + 账户 ============ */
async function bootstrap(){
  let allNotes=[];
  try{
    allNotes=await dbAll('notes');
  }catch(e){
    toast('浏览器数据库不可用，请更换现代浏览器打开','warn');
    return;
  }
  let migrated=0;
  try{
    if(!allNotes.length&&!localStorage.getItem(MIGRATE_FLAG)){
      let legacy=[];
      try{
        const raw=localStorage.getItem(LEGACY_KEY);
        const parsed=raw?JSON.parse(raw):[];
        if(Array.isArray(parsed))legacy=parsed;
      }catch(e){legacy=[];}
      for(const t of legacy){
        if(!t||(!t.title&&!t.body))continue;
        const now=new Date().toISOString();
        allNotes.push({
          id:t.id||uid(),ownerId:null,
          title:String(t.title||''),
          body:String(t.body||''),
          tags:Array.isArray(t.tags)?[...new Set(t.tags.map(String))].slice(0,8):[],
          link:null,media:[],
          createdAt:t.createdAt||now,
          updatedAt:t.updatedAt||t.createdAt||now
        });
        migrated++;
      }
      localStorage.setItem(MIGRATE_FLAG,'1');
    }
  }catch(e){}
  // 账户初始化
  accounts=await dbAll('accounts');
  if(!accounts.length)await createAccount('默认空间','');
  for(const n of allNotes){
    if(!n.ownerId||!getAccount(n.ownerId)){n.ownerId=accounts[0].id;await dbPut('notes',n);}
  }
  updateAccountBtn();
  let saved='';
  try{saved=localStorage.getItem(ACCOUNT_KEY)||'';}catch(e){}
  if(saved&&getAccount(saved))await loadAccount(saved);
  else if(accounts.length===1&&!accounts[0].passwordHash)await loadAccount(accounts[0].id);
  else{currentAccountId=null;notes=[];render();updateQuota();openAccountModal();}
  if(migrated)toast('已自动迁入 '+migrated+' 则旧想法');
}
