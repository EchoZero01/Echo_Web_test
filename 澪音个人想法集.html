<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澪音 · EchoZero 的想法集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232E5A4C'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23F5F2E9' font-family='serif'%3E%E6%BF%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============ 设计变量：纸墨主题 ============ */
:root{
  --paper:#F4F1E8;
  --paper-deep:#EBE6D8;
  --card:#FBF9F2;
  --ink:#21252B;
  --ink-2:#50575F;
  --ink-3:#8B9097;
  --line:#DCD5C2;
  --line-strong:#C8C0A9;
  --accent:#2E5A4C;
  --accent-deep:#1F4035;
  --accent-wash:#DEE9E2;
  --accent-ink:#17332A;
  --danger:#9C3D2E;
  --danger-wash:#F0DDD7;
  --shadow:0 1px 0 rgba(33,37,43,.04), 0 10px 28px -18px rgba(33,37,43,.28);
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
[data-theme="dark"]{
  --paper:#141619;
  --paper-deep:#1A1D21;
  --card:#1D2025;
  --ink:#E8E5DB;
  --ink-2:#A7ADB4;
  --ink-3:#6C727A;
  --line:#2C3037;
  --line-strong:#3A3F47;
  --accent:#83B8A3;
  --accent-deep:#A9D1C0;
  --accent-wash:#21342D;
  --accent-ink:#C6E2D4;
  --danger:#D6806E;
  --danger-wash:#3A241F;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 14px 32px -20px rgba(0,0,0,.7);
}

/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.7;
  min-height:100vh;
  transition:background .3s ease,color .3s ease;
}
::selection{background:var(--accent);color:var(--paper)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}

/* 纸面纹理：极淡的颗粒，靠径向渐变实现，不依赖图片 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(33,37,43,.035) 1px,transparent 1px);
  background-size:22px 22px;
}
[data-theme="dark"] body::before,body:has([data-theme="dark"])::before{opacity:.25}

.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 28px}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1060px;margin:0 auto;padding:0 28px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.seal{
  width:36px;height:36px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:var(--paper);
  font-family:var(--serif);font-weight:700;font-size:17px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.brand-name{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.12em}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.22em;margin-top:1px}
.tools{display:flex;align-items:center;gap:6px}
.icon-btn{
  display:inline-flex;align-items:center;gap:7px;
  height:36px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:13px;
  transition:border-color .2s,color .2s,background .2s;
}
.icon-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;flex:none}
.icon-btn.text-only .label{display:inline}
@media(max-width:640px){.icon-btn.text-only .label{display:none}.icon-btn{padding:0 10px}}

/* ============ Hero ============ */
.hero{padding-block:72px 40px;border-bottom:1px solid var(--line)}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;letter-spacing:.3em;color:var(--accent);
  font-weight:500;margin-bottom:22px;
}
.hero-kicker::before{content:"";width:26px;height:1px;background:var(--accent)}
.hero h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(34px,5.4vw,56px);line-height:1.25;letter-spacing:.01em;
}
.hero h1 .dot{color:var(--accent)}
.hero-desc{margin-top:18px;max-width:560px;color:var(--ink-2);font-size:15.5px}
.stats{display:flex;flex-wrap:wrap;gap:14px 34px;margin-top:34px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.1;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.06em}

/* ============ 书写区 ============ */
.composer{
  margin:40px 0 26px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);overflow:hidden;
}
.composer-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px;border-bottom:1px dashed var(--line);
  color:var(--ink-2);font-size:13px;letter-spacing:.05em;
}
.composer-head svg{width:16px;height:16px;color:var(--accent)}
.composer input[type=text],.composer textarea,.modal-pane input[type=text],.modal-pane textarea{
  width:100%;background:transparent;border:none;outline:none;resize:none;
  color:var(--ink);
}
.composer .c-title{
  font-family:var(--serif);font-weight:700;font-size:19px;
  padding:16px 20px 4px;
}
.composer .c-body{
  display:block;min-height:110px;padding:8px 20px 12px;
  line-height:1.85;font-size:15px;
}
.composer input.c-tags{
  display:block;width:calc(100% - 40px);
  margin:0 20px;padding:10px 14px;
  border:1px solid var(--line);border-radius:9px;
  background:var(--paper);font-size:13.5px;color:var(--ink);
}
.composer .c-tags:focus{border-color:var(--accent)}
.composer-foot{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 20px;border-top:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 80%,var(--paper));
}
.hint-text{font-size:12px;color:var(--ink-3)}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  height:40px;padding:0 22px;border-radius:9px;
  background:var(--accent);color:var(--paper);font-weight:500;font-size:14.5px;
  transition:background .2s,transform .1s;
}
.btn-primary:hover{background:var(--accent-deep)}
[data-theme="dark"] .btn-primary{color:#12211B}
[data-theme="dark"] .btn-primary:hover{color:#0E1A15}
.btn-primary:active{transform:translateY(1px)}
.btn-primary svg{width:16px;height:16px}
.btn-ghost{
  height:40px;padding:0 18px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink-2);font-size:14px;transition:border-color .2s,color .2s;
}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--ink)}

/* ============ 筛选工具条 ============ */
.toolbar{
  display:flex;flex-direction:column;gap:14px;
  margin:30px 0 24px;
}
.search-box{
  display:flex;align-items:center;gap:10px;
  height:44px;padding:0 16px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);
}
.search-box svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.search-box input{flex:1;background:transparent;border:none;outline:none;font-size:14.5px}
.search-box .clear-search{display:none;color:var(--ink-3);font-size:13px;padding:4px}
.search-box.has-text .clear-search{display:inline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  height:32px;padding:0 15px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);font-size:13px;
  transition:all .18s;white-space:nowrap;
}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:500}
[data-theme="dark"] .chip.active{color:#12211B}
.chip .n{opacity:.6;font-size:11px;margin-left:4px}

/* ============ 想法流（报纸式分栏） ============ */
.stream{column-count:2;column-gap:20px;margin-bottom:40px}
@media(min-width:960px){.stream{column-count:2}}
@media(max-width:680px){.stream{column-count:1}}
.card{
  break-inside:avoid;margin-bottom:20px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:20px 20px 14px;position:relative;
  transition:border-color .2s,box-shadow .25s,transform .25s;
}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card::before{
  content:"";position:absolute;top:-1px;left:18px;right:18px;height:2px;
  background:var(--accent);border-radius:2px;opacity:0;transition:opacity .2s;
}
.card:hover::before{opacity:.85}
.card-title{font-family:var(--serif);font-weight:700;font-size:17.5px;line-height:1.5;margin-bottom:8px;word-break:break-word}
.card-body{
  font-family:var(--serif);font-size:14.5px;line-height:1.9;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;
}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{
  font-family:var(--sans);font-size:11.5px;color:var(--accent);
  background:var(--accent-wash);border-radius:5px;padding:2px 8px;
  letter-spacing:.03em;
}
[data-theme="dark"] .tag{color:var(--accent-ink)}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
}
.card-date{font-size:12px;color:var(--ink-3)}
.card-actions{display:flex;gap:2px;opacity:0;transition:opacity .2s}
.card:hover .card-actions{opacity:1}
@media(hover:none){.card-actions{opacity:1}}
.mini-btn{
  display:inline-flex;align-items:center;gap:4px;
  height:28px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--ink-3);
  transition:background .15s,color .15s;
}
.mini-btn:hover{background:var(--paper-deep);color:var(--ink)}
.mini-btn.danger{color:var(--danger)}
.mini-btn.danger:hover{background:var(--danger-wash)}
.mini-btn svg{width:13px;height:13px}

/* 空态 */
.empty{
  display:none;text-align:center;padding:70px 30px;margin-bottom:40px;
  border:1.5px dashed var(--line-strong);border-radius:14px;background:var(--card);
}
.empty.show{display:block}
.empty svg{width:40px;height:40px;color:var(--ink-3);margin-bottom:16px}
.empty h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:8px}
.empty p{color:var(--ink-3);font-size:14px}

/* ============ 页脚 ============ */
.footer{border-top:1px solid var(--line);padding:30px 0 46px;color:var(--ink-3);font-size:12.5px}
.footer-inner{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center}
.footer strong{color:var(--ink-2);font-weight:500}

/* ============ 模态框 ============ */
.modal{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:flex-start;justify-content:center;
  padding:60px 20px 40px;overflow-y:auto;
}
.modal.show{display:flex}
.modal-mask{position:fixed;inset:0;background:rgba(20,22,25,.5);backdrop-filter:blur(3px)}
.modal-pane{
  position:relative;width:100%;max-width:640px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.45);
  animation:modalIn .22s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--serif);font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.modal-close:hover{background:var(--paper-deep);color:var(--ink)}
.modal-close svg{width:17px;height:17px}
.modal-pane .m-title{font-family:var(--serif);font-weight:700;font-size:19px;padding:18px 20px 4px;width:100%}
.modal-pane .m-body{display:block;width:100%;min-height:200px;padding:8px 20px 12px;line-height:1.85;font-size:15px;outline:none;resize:none}
.modal-pane input.m-tags{margin:0 20px;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:13.5px;width:calc(100% - 40px)}
.modal-pane .m-tags:focus{border-color:var(--accent)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);margin-top:14px}

/* ============ Toast ============ */
.toast-wrap{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:10px;font-size:13.5px;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.4);
  animation:toastIn .25s ease;
}
.toast.warn{background:var(--danger);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ============ 移动端细节修正 ============ */
@media(max-width:640px){
  .topbar-inner{height:60px}
  .icon-btn{min-width:40px;height:40px}
  .composer .c-body{font-size:16px}
  .composer input.c-tags{font-size:16px}
  .search-box input{font-size:16px}
  .modal-pane .m-body{font-size:16px}
  .modal-pane input.m-tags{font-size:16px}
  .hero{padding-block:56px 36px}
  .wrap,.topbar-inner{padding-left:20px;padding-right:20px}
}

/* 无障碍 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#">
      <span class="seal">澪</span>
      <span>
        <span class="brand-name">澪音</span>
        <span class="brand-sub" style="display:block">ECHOZERO</span>
      </span>
    </a>
    <div class="tools">
      <button class="icon-btn text-only" id="btnImport" title="从备份文件导入">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="label">导入</span>
      </button>
      <button class="icon-btn text-only" id="btnExport" title="导出备份文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="label">备份</span>
      </button>
      <button class="icon-btn text-only" id="btnExportMd" title="导出为 Markdown 文稿">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>
        <span class="label">文稿</span>
      </button>
      <button class="icon-btn" id="btnTheme" title="切换明暗主题">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ===== Hero ===== -->
<section class="wrap hero">
  <span class="hero-kicker">ECHOZERO 的想法档案馆</span>
  <h1>思无定式，<br>落字<span class="dot">成痕</span>。</h1>
  <p class="hero-desc">EchoZero，把转瞬即逝的念头、读书时的批注、深夜的自问自答，都安放在这里。它们只属于你，只存在于你的电脑之中。</p>
  <div class="stats">
    <div class="stat"><b id="statCount">0</b><span>记下的想法</span></div>
    <div class="stat"><b id="statTags">0</b><span>不同的标签</span></div>
    <div class="stat"><b id="statRecent">—</b><span>最近一次记录</span></div>
  </div>
</section>

<main class="wrap">
  <!-- ===== 书写区 ===== -->
  <section class="composer" id="composer">
    <div class="composer-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      写下此刻的想法
    </div>
    <input class="c-title" id="cTitle" type="text" placeholder="给它一个标题（可留空）" maxlength="80">
    <textarea class="c-body" id="cBody" placeholder="想到什么写什么，不必完整，不必正确……（Ctrl + Enter 快速记下）"></textarea>
    <input class="c-tags" id="cTags" type="text" placeholder="标签：用空格或逗号分隔，例如 读书 灵感 待办">
    <div class="composer-foot">
      <span class="hint-text" id="cCounter">0 字</span>
      <button class="btn-primary" id="btnSave">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        记下这则
      </button>
    </div>
  </section>

  <!-- ===== 搜索与筛选 ===== -->
  <section class="toolbar">
    <div class="search-box" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="搜索想法的标题、正文或标签…">
      <button class="clear-search" id="clearSearch">清除</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- ===== 想法流 ===== -->
  <section class="stream" id="stream"></section>

  <!-- ===== 空态 ===== -->
  <section class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <h3 id="emptyTitle">还没有任何想法</h3>
    <p id="emptyDesc">在上方的纸页里写下第一则吧，哪怕只是一句话。</p>
  </section>
</main>

<!-- ===== 页脚 ===== -->
<footer class="footer">
  <div class="wrap footer-inner">
    <span><strong>澪音</strong> · EchoZero 的离线想法角落</span>
    <span>所有内容仅保存在当前浏览器中，清理浏览器数据前，请先点右上角「备份」。</span>
  </div>
</footer>

<!-- ===== 编辑模态框 ===== -->
<div class="modal" id="modal">
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-pane" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">编辑这则想法</h3>
      <button class="modal-close" id="modalClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <input class="m-title" id="mTitle" type="text" placeholder="标题（可留空）" maxlength="80">
    <textarea class="m-body" id="mBody" placeholder="想法正文…"></textarea>
    <input class="m-tags" id="mTags" type="text" placeholder="标签：用空格或逗号分隔">
    <div class="modal-foot">
      <button class="btn-ghost" id="mCancel">取消</button>
      <button class="btn-primary" id="mSave">保存修改</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<script>
(function(){
'use strict';

/* ---------- 常量与状态 ---------- */
const STORE_KEY='mosi.thoughts.v1';
const THEME_KEY='mosi.theme';
const EDIT_HTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>编辑';
const DELETE_HTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除';

let thoughts=loadThoughts();
let activeTag=null;
let query='';
let editingId=null;
const deleteTimers=new Map();

const $=id=>document.getElementById(id);

/* ---------- 持久化 ---------- */
function loadThoughts(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    const arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(e){return [];}
}
function persist(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(thoughts));}
  catch(e){toast('保存失败：浏览器存储空间可能已满','warn');}
}

/* ---------- 工具函数 ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function parseTags(str){
  const raw=str.split(/[,，、;；\s]+/)
    .map(t=>t.replace(/^#+/,'').trim()).filter(Boolean);
  return [...new Set(raw)].slice(0,8).map(t=>t.slice(0,12));
}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(iso){
  const d=new Date(iso);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function relativeTime(iso){
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.floor(diff/60000);
  if(m<1)return '刚刚';
  if(m<60)return m+' 分钟前';
  const h=Math.floor(m/60);
  if(h<24)return h+' 小时前';
  const d=Math.floor(h/24);
  if(d<7)return d+' 天前';
  const dt=new Date(iso);
  return (dt.getMonth()+1)+'月'+dt.getDate()+'日';
}
function debounce(fn,ms){
  let t;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms);};
}
function download(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function fileStamp(){
  const d=new Date();
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
}

/* ---------- 数据筛选 ---------- */
function getFiltered(){
  let list=thoughts.slice();
  if(activeTag)list=list.filter(t=>t.tags.includes(activeTag));
  if(query){
    const q=query.toLowerCase();
    list=list.filter(t=>(t.title+'\n'+t.body+'\n'+t.tags.join(' ')).toLowerCase().includes(q));
  }
  list.sort((a,b)=>(b.updatedAt||b.createdAt).localeCompare(a.updatedAt||a.createdAt));
  return list;
}
function tagCounts(){
  const m=new Map();
  thoughts.forEach(t=>t.tags.forEach(tag=>m.set(tag,(m.get(tag)||0)+1)));
  return [...m.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]));
}

/* ---------- 渲染 ---------- */
function render(){
  renderStats();
  renderChips();
  renderStream();
}

function renderStats(){
  $('statCount').textContent=thoughts.length;
  $('statTags').textContent=tagCounts().length;
  if(thoughts.length){
    const latest=thoughts.map(t=>t.updatedAt||t.createdAt).sort().pop();
    $('statRecent').textContent=relativeTime(latest);
  }else{
    $('statRecent').textContent='—';
  }
}

function renderChips(){
  const box=$('chips');
  box.innerHTML='';
  const all=document.createElement('button');
  all.className='chip'+(activeTag===null?' active':'');
  all.textContent='全部';
  const nAll=document.createElement('span');nAll.className='n';nAll.textContent=thoughts.length;
  all.appendChild(nAll);
  all.addEventListener('click',()=>{activeTag=null;render();});
  box.appendChild(all);
  tagCounts().forEach(([tag,count])=>{
    const c=document.createElement('button');
    c.className='chip'+(activeTag===tag?' active':'');
    c.textContent=tag;
    const n=document.createElement('span');n.className='n';n.textContent=count;
    c.appendChild(n);
    c.addEventListener('click',()=>{activeTag=tag;render();});
    box.appendChild(c);
  });
}

function renderStream(){
  const stream=$('stream');
  const empty=$('empty');
  stream.innerHTML='';
  const list=getFiltered();

  if(!list.length){
    empty.classList.add('show');
    if(thoughts.length===0){
      $('emptyTitle').textContent='还没有任何想法';
      $('emptyDesc').textContent='在上方的纸页里写下第一则吧，哪怕只是一句话。';
    }else{
      $('emptyTitle').textContent='没有找到匹配的想法';
      $('emptyDesc').textContent='换个关键词，或清除标签筛选试试。';
    }
    return;
  }
  empty.classList.remove('show');

  list.forEach(t=>stream.appendChild(buildCard(t)));
}

function buildCard(t){
  const card=document.createElement('article');
  card.className='card';

  if(t.title){
    const h=document.createElement('h3');
    h.className='card-title';
    h.textContent=t.title;
    card.appendChild(h);
  }

  if(t.body){
    const body=document.createElement('div');
    body.className='card-body';
    body.textContent=t.body;
    card.appendChild(body);
  }

  if(t.tags.length){
    const tags=document.createElement('div');
    tags.className='card-tags';
    t.tags.forEach(tag=>{
      const s=document.createElement('button');
      s.className='tag';s.textContent=tag;
      s.title='只看「'+tag+'」';
      s.addEventListener('click',()=>{
        activeTag=tag;render();
        const toolbar=document.querySelector('.toolbar');
        window.scrollTo({top:toolbar.getBoundingClientRect().top+window.scrollY-76,behavior:'smooth'});
      });
      tags.appendChild(s);
    });
    card.appendChild(tags);
  }

  const foot=document.createElement('div');
  foot.className='card-foot';
  const date=document.createElement('span');
  date.className='card-date';
  date.textContent=relativeTime(t.updatedAt||t.createdAt);
  date.title=fmtDate(t.updatedAt||t.createdAt)+(t.updatedAt&&t.updatedAt!==t.createdAt?'（已编辑）':'');
  foot.appendChild(date);

  const actions=document.createElement('div');
  actions.className='card-actions';
  const editBtn=document.createElement('button');
  editBtn.className='mini-btn';
  editBtn.innerHTML=EDIT_HTML;
  editBtn.setAttribute('aria-label','编辑');
  editBtn.addEventListener('click',()=>openEdit(t.id));
  const delBtn=document.createElement('button');
  delBtn.className='mini-btn danger';
  delBtn.innerHTML=DELETE_HTML;
  delBtn.setAttribute('aria-label','删除');
  delBtn.addEventListener('click',()=>armDelete(delBtn,t.id));
  actions.appendChild(editBtn);actions.appendChild(delBtn);
  foot.appendChild(actions);
  card.appendChild(foot);

  return card;
}

/* ---------- 新建想法 ---------- */
function saveNew(){
  const title=$('cTitle').value.trim();
  const body=$('cBody').value.trim();
  const tags=parseTags($('cTags').value);
  if(!title&&!body){toast('写点什么再记下吧','warn');return;}
  const now=new Date().toISOString();
  thoughts.unshift({id:uid(),title,body,tags,createdAt:now,updatedAt:now});
  persist();render();
  $('cTitle').value='';$('cBody').value='';$('cTags').value='';
  updateCounter();
  $('cBody').focus();
  toast('已记下这则想法');
}
function updateCounter(){
  $('cCounter').textContent=$('cBody').value.length+' 字';
}

/* ---------- 编辑模态 ---------- */
function openEdit(id){
  const t=thoughts.find(x=>x.id===id);
  if(!t)return;
  editingId=id;
  $('mTitle').value=t.title;
  $('mBody').value=t.body;
  $('mTags').value=t.tags.join(' ');
  $('modal').classList.add('show');
  setTimeout(()=>$('mBody').focus(),0);
}
function closeModal(){
  $('modal').classList.remove('show');
  editingId=null;
}
function saveEdit(){
  const t=thoughts.find(x=>x.id===editingId);
  if(!t){closeModal();return;}
  const title=$('mTitle').value.trim();
  const body=$('mBody').value.trim();
  const tags=parseTags($('mTags').value);
  if(!title&&!body){toast('想法不能是空白的','warn');return;}
  t.title=title;t.body=body;t.tags=tags;
  t.updatedAt=new Date().toISOString();
  persist();render();closeModal();
  toast('修改已保存');
}

/* ---------- 删除（两步确认） ---------- */
function armDelete(btn,id){
  if(btn.dataset.confirm==='1'){doDelete(id);return;}
  btn.dataset.confirm='1';
  btn.textContent='确认删除？';
  const timer=setTimeout(()=>resetDeleteBtn(btn),2600);
  deleteTimers.set(id,timer);
}
function resetDeleteBtn(btn){
  btn.dataset.confirm='';
  btn.innerHTML=DELETE_HTML;
}
function doDelete(id){
  const timer=deleteTimers.get(id);
  if(timer){clearTimeout(timer);deleteTimers.delete(id);}
  thoughts=thoughts.filter(x=>x.id!==id);
  persist();render();
  toast('已删除这则想法');
}

/* ---------- 导出 / 导入 ---------- */
function exportJSON(){
  if(!thoughts.length){toast('还没有想法可以备份','warn');return;}
  const data={app:'澪音',owner:'EchoZero',version:1,exportedAt:new Date().toISOString(),thoughts:thoughts};
  download('澪音备份-'+fileStamp()+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');
  toast('备份文件已开始下载');
}
function exportMarkdown(){
  if(!thoughts.length){toast('还没有想法可以导出','warn');return;}
  const list=thoughts.slice().sort((a,b)=>(a.createdAt).localeCompare(b.createdAt));
  let out='# 澪音 · EchoZero 的想法集\n\n> 导出时间：'+fmtDate(new Date().toISOString())+'\n> 共 '+thoughts.length+' 则想法\n\n---\n\n';
  list.forEach(t=>{
    out+='## '+(t.title||'（无标题）')+'\n\n';
    out+='*'+fmtDate(t.createdAt)+'*\n\n';
    if(t.tags.length)out+=t.tags.map(x=>'#'+x).join(' ')+'\n\n';
    if(t.body)out+=t.body+'\n\n';
    out+='---\n\n';
  });
  download('澪音文稿-'+fileStamp()+'.md',out,'text/markdown;charset=utf-8');
  toast('Markdown 文稿已开始下载');
}
function importFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const arr=Array.isArray(data)?data:(Array.isArray(data.thoughts)?data.thoughts:null);
      if(!arr)throw new Error('bad format');
      const map=new Map(thoughts.map(t=>[t.id,t]));
      let added=0,updated=0;
      arr.forEach(x=>{
        if(!x||(!x.title&&!x.body))return;
        const id=x.id||uid();
        const now=new Date().toISOString();
        const norm={
          id:id,
          title:String(x.title||'').trim(),
          body:String(x.body||'').trim(),
          tags:Array.isArray(x.tags)?[...new Set(x.tags.map(String))].slice(0,8):[],
          createdAt:x.createdAt||now,
          updatedAt:x.updatedAt||x.createdAt||now
        };
        if(map.has(id)){updated++;Object.assign(map.get(id),norm);}
        else{added++;thoughts.push(norm);map.set(id,norm);}
      });
      persist();render();
      toast('导入完成：新增 '+added+' 则，更新 '+updated+' 则');
    }catch(e){
      toast('导入失败：请选择「澪音」导出的备份文件','warn');
    }
  };
  reader.readAsText(file);
}

/* ---------- 明暗主题 ---------- */
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  $('iconMoon').style.display=theme==='dark'?'none':'';
  $('iconSun').style.display=theme==='dark'?'':'none';
  try{localStorage.setItem(THEME_KEY,theme);}catch(e){}
}

/* ---------- Toast ---------- */
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast'+(type==='warn'?' warn':'');
  el.textContent=msg;
  $('toastWrap').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260);},2200);
}

/* ---------- 事件绑定 ---------- */
document.querySelector('.brand').addEventListener('click',e=>{
  e.preventDefault();
  window.scrollTo({top:0,behavior:'smooth'});
});
$('btnSave').addEventListener('click',saveNew);
$('cBody').addEventListener('input',updateCounter);
['cTitle','cBody','cTags'].forEach(id=>{
  $(id).addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();saveNew();}
  });
});

const onSearch=debounce(function(){
  query=$('searchInput').value.trim();
  $('searchBox').classList.toggle('has-text',!!query);
  renderStream();
},160);
$('searchInput').addEventListener('input',onSearch);
$('clearSearch').addEventListener('click',()=>{
  $('searchInput').value='';query='';
  $('searchBox').classList.remove('has-text');
  renderStream();$('searchInput').focus();
});

$('btnExport').addEventListener('click',exportJSON);
$('btnExportMd').addEventListener('click',exportMarkdown);
$('btnImport').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(file)importFile(file);
  e.target.value='';
});

$('btnTheme').addEventListener('click',()=>{
  applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
});

$('mSave').addEventListener('click',saveEdit);
$('mCancel').addEventListener('click',closeModal);
$('modalClose').addEventListener('click',closeModal);
$('modalMask').addEventListener('click',closeModal);
$('mBody').addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();saveEdit();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('modal').classList.contains('show'))closeModal();
});

/* ---------- 初始化 ---------- */
let savedTheme='light';
try{savedTheme=localStorage.getItem(THEME_KEY)||'light';}catch(e){}
applyTheme(savedTheme);
updateCounter();
render();
})();
</script>
</body>
</html>
